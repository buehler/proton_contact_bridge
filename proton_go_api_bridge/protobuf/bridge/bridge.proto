syntax = "proto3";

package bridge;

option go_package = "proton_go_api_bridge/native/protobuf/bridge";

import "commands/commands.proto";
import "results/results.proto";

message Command {
  uint32 session_id = 1;

  oneof command {
    commands.Login login = 2;
  }
}

message Result {
  oneof response {
    results.Error error = 1;
    results.Login login = 2;
  }
}
