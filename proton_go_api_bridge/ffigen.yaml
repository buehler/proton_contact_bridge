# Run with `dart run ffigen --config ffigen.yaml`.
name: ProtonGoApiBridgeBindings
description: |
  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/bindings.g.dart'
headers:
  entry-points:
    - 'src/bridge.h'
  include-directives:
    - 'src/bridge.h'
ffi-native:
comments:
  style: any
  length: full
