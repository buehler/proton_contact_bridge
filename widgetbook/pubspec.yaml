publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
  proton_contact_bridge:
    path: ../
  google_fonts: ^8.2.1
