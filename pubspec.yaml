name: proton_contact_bridge
description: "A contacts app that syncs with Proton Contacts (from proton mail) and provides local contact sync mechanisms to phones"
publish_to: "none"

version: 1.0.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.2.0
  riverpod_annotation: ^4.0.3
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0
  dsrp: ^0.5.5
  dio: ^5.10.0
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  dart_pg: ^2.1.0
  rxdart: ^0.28.0
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.1
  async: ^2.13.1
  go_router: ^18.0.1
  flex_color_scheme: ^8.4.0
  google_fonts: ^8.2.0
  image_picker: ^1.2.3
  flutter_riverpod: ^3.3.2
  proton_go_api_bridge:
    path: ./proton_go_api_bridge
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0
  talker: ^5.1.20
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  logging: ^1.3.0
  theme_tailor_annotation: ^4.0.0
  lucide_icons_flutter: ^3.1.18
  flutter_libphonenumber: ^2.8.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4
  theme_tailor: ^4.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
