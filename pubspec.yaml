name: proton_contact_bridge
description: "A contacts app that syncs with Proton Contacts (from proton mail) and provides local contact sync mechanisms to phones"
publish_to: "none"

version: 1.2.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  riverpod_annotation: ^4.0.7
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  dsrp: ^0.5.5
  dio: ^5.11.1
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  dart_pg: ^2.1.0
  rxdart: ^0.28.0
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.2
  async: ^2.13.1
  go_router: ^18.0.2
  flex_color_scheme: ^9.0.0
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  flutter_riverpod: ^3.4.3
  proton_go_api_bridge:
    path: ./proton_go_api_bridge
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  talker: ^5.1.20
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  logging: ^1.3.0
  theme_tailor_annotation: ^4.0.0
  lucide_icons_flutter: ^3.1.22
  flutter_libphonenumber: ^2.8.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4
  theme_tailor: ^4.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
